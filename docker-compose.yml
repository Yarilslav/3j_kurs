services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
    command: >
      python run.py
    depends_on:
      - db

  alembic:
    build: .
    volumes:
      - ./:/app
    environment:
      PYTHONPATH: /app
    env_file:
      - .env
    depends_on:
      - db
    command: >
      alembic upgrade head

  db:
    # Постгрес БД:
    image: postgres:16
    environment:
      POSTGRES_DB: praktychni
      POSTGRES_USER: praktychni
      POSTGRES_PASSWORD: praktychni
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
