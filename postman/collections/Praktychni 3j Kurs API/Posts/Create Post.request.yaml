$kind: http-request
name: Create Post
method: POST
url: '{{base_url}}/posts/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "title": "My First Post",
      "content": "This is the content of my first post."
    }
