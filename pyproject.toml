[tool.poetry]
name = "praktychni-3j-kurs"
version = "0.1.0"
description = "___"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Потрібні версії:
python = "^3.11"
fastapi = "^0.135.1"
uvicorn = "^0.41.0"
sqlalchemy = "^2.0.48"
psycopg = {extras = ["binary"], version = "^3.3.3"}
alembic = "^1.18.4"
pydantic-settings = "^2.13.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "4.1.3"
pyjwt = "^2.12.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
#для локальної перевірки
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"
httpx = "^0.28.1"

[tool.poetry.scripts]
praktychni-3j-kurs = "app.main:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
